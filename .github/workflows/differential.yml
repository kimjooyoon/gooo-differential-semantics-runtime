name: gooo-differential-semantics

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  DIFF_ROOT: ${{ runner.temp }}/gooo-differential
  SEMANTICS: .gooo/semantics.gooo
  CORPUS: .gooo/corpus.gooo

jobs:
  differential-semantics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true

      - name: Compile runtime and validate fixed corpus
        run: |
          set -euo pipefail
          mkdir -p "$DIFF_ROOT/artifacts/cases" "$DIFF_ROOT/generated" "$GITHUB_WORKSPACE/.ci-generated"
          /usr/bin/time -f '%e %M' -o "$DIFF_ROOT/compile.time" go test -run '^$' ./...
          go build -o "$DIFF_ROOT/gooo-runtime" ./cmd/gooo-runtime
          "$DIFF_ROOT/gooo-runtime" corpus --path "$CORPUS" --output "$DIFF_ROOT/artifacts/corpus-validation.json"

      - name: Emit and build every generated Go binary
        run: |
          set -euo pipefail
          build_start=$(date +%s%3N)
          for case_id in $(jq -r '.cases[].id' "$CORPUS"); do
            program=$(jq -r --arg id "$case_id" '.cases[] | select(.id == $id) | .program' "$CORPUS")
            variant=$(jq -r --arg id "$case_id" '.cases[] | select(.id == $id) | .candidate_variant' "$CORPUS")
            source="$GITHUB_WORKSPACE/.ci-generated/$case_id/main.go"
            binary="$DIFF_ROOT/generated/$case_id"
            mkdir -p "$(dirname "$source")"
            "$DIFF_ROOT/gooo-runtime" emit --semantics "$SEMANTICS" --program "$program" --variant "$variant" --output "$source"
            gofmt -w "$source"
            mkdir -p "$(dirname "$binary")"
            /usr/bin/time -f '%e %M' -o "$DIFF_ROOT/build-$case_id.time" go build -o "$binary" "$source"
          done
          build_end=$(date +%s%3N)
          printf '%s %s\n' "$((build_end - build_start))" "$(awk 'BEGIN {m=0} {if ($2>m) m=$2} END {print m}' "$DIFF_ROOT"/build-*.time)" > "$DIFF_ROOT/build.time"

      - name: Execute reference interpreter and generated binaries
        id: execution
        continue-on-error: true
        run: |
          set +e
          status=0
          /usr/bin/time -f '%e %M' -o "$DIFF_ROOT/test.time" bash -c '
            set -euo pipefail
            for case_id in $(jq -r ".cases[] | select(.replay == false) | .id" "$CORPUS"); do
              program=$(jq -r --arg id "$case_id" ".cases[] | select(.id == \$id) | .program" "$CORPUS")
              case_dir="$DIFF_ROOT/artifacts/cases/$case_id"
              args=()
              while IFS= read -r grant; do
                [ -z "$grant" ] || args+=(--grant "$grant")
              done < <(jq -r --arg id "$case_id" ".cases[] | select(.id == \$id) | .grants[]?" "$CORPUS")
              while IFS= read -r external; do
                [ -z "$external" ] || args+=(--external "$external")
              done < <(jq -r --arg id "$case_id" ".cases[] | select(.id == \$id) | .externals | to_entries[]? | (\"\(.key)=\(.value)\")" "$CORPUS")
              "$DIFF_ROOT/gooo-runtime" reference --semantics "$SEMANTICS" --program "$program" --output "$case_dir/reference.json" "${args[@]}"
              "$DIFF_ROOT/generated/$case_id" "${args[@]}" > "$case_dir/generated.json"
            done
          '
          status=$?
          exit "$status"

      - name: Replay the fixed deterministic case
        id: replay
        continue-on-error: true
        run: |
          set +e
          status=0
          /usr/bin/time -f '%e %M' -o "$DIFF_ROOT/integration.time" bash -c '
            set -euo pipefail
            case_id=$(jq -r ".cases[] | select(.replay == true) | .id" "$CORPUS")
            program=$(jq -r --arg id "$case_id" ".cases[] | select(.id == \$id) | .program" "$CORPUS")
            case_dir="$DIFF_ROOT/artifacts/cases/$case_id"
            args=()
            while IFS= read -r grant; do
              [ -z "$grant" ] || args+=(--grant "$grant")
            done < <(jq -r --arg id "$case_id" ".cases[] | select(.id == \$id) | .grants[]?" "$CORPUS")
            "$DIFF_ROOT/gooo-runtime" reference --semantics "$SEMANTICS" --program "$program" --output "$case_dir/reference.json" "${args[@]}"
            "$DIFF_ROOT/generated/$case_id" "${args[@]}" > "$case_dir/generated.json"
            "$DIFF_ROOT/generated/$case_id" "${args[@]}" > "$case_dir/generated-replay.json"
            cmp "$case_dir/generated.json" "$case_dir/generated-replay.json"
            jq -n --arg digest "$(sha256sum "$case_dir/generated.json" | awk "{print \$1}")" \
              "{schema:\"gooo.replay/v1\",case_id:\"$case_id\",identical:true,output_sha256:\$digest}" > "$case_dir/replay.json"
          '
          status=$?
          exit "$status"

      - name: Compare typed values, ordered traces, and terminal digests
        id: conformance
        continue-on-error: true
        run: |
          set +e
          status=0
          /usr/bin/time -f '%e %M' -o "$DIFF_ROOT/conformance.time" bash -c '
            set -u
            for case_id in $(jq -r ".cases[].id" "$CORPUS"); do
              expected=$(jq -r --arg id "$case_id" ".cases[] | select(.id == \$id) | .expected_status" "$CORPUS")
              "$DIFF_ROOT/gooo-runtime" compare \
                --case-id "$case_id" \
                --expected "$expected" \
                --reference "$DIFF_ROOT/artifacts/cases/$case_id/reference.json" \
                --generated "$DIFF_ROOT/artifacts/cases/$case_id/generated.json" \
                --output "$DIFF_ROOT/artifacts/cases/$case_id/comparison.json"
              if [ "$?" -ne 0 ]; then
                exit 1
              fi
            done
          '
          status=$?
          exit "$status"

      - name: Write differential evidence artifact
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$DIFF_ROOT/artifacts/generated-go"
          if [ -d "$GITHUB_WORKSPACE/.ci-generated" ]; then
            cp -R "$GITHUB_WORKSPACE/.ci-generated/." "$DIFF_ROOT/artifacts/generated-go/"
          fi
          if [ -d "$DIFF_ROOT/generated" ]; then
            cp -R "$DIFF_ROOT/generated/." "$DIFF_ROOT/artifacts/generated-go/"
          fi
          compile_ms=$(awk '{printf "%d", $1 * 1000 + 0.5}' "$DIFF_ROOT/compile.time" 2>/dev/null || echo 0)
          compile_rss=$(awk '{print $2}' "$DIFF_ROOT/compile.time" 2>/dev/null || echo 0)
          build_ms=$(awk '{print $1}' "$DIFF_ROOT/build.time" 2>/dev/null || echo 0)
          build_rss=$(awk '{print $2}' "$DIFF_ROOT/build.time" 2>/dev/null || echo 0)
          test_ms=$(awk '{printf "%d", $1 * 1000 + 0.5}' "$DIFF_ROOT/test.time" 2>/dev/null || echo 0)
          test_rss=$(awk '{print $2}' "$DIFF_ROOT/test.time" 2>/dev/null || echo 0)
          conformance_ms=$(awk '{printf "%d", $1 * 1000 + 0.5}' "$DIFF_ROOT/conformance.time" 2>/dev/null || echo 0)
          conformance_rss=$(awk '{print $2}' "$DIFF_ROOT/conformance.time" 2>/dev/null || echo 0)
          integration_ms=$(awk '{printf "%d", $1 * 1000 + 0.5}' "$DIFF_ROOT/integration.time" 2>/dev/null || echo 0)
          integration_rss=$(awk '{print $2}' "$DIFF_ROOT/integration.time" 2>/dev/null || echo 0)
          total=$(jq '.cases | length' "$CORPUS")
          selected=$total
          executed=$(find "$DIFF_ROOT/artifacts/cases" -name generated.json -type f | wc -l | tr -d ' ')
          reused=0
          failed=$(jq -s '[.[] | select(.verdict != .expected_status)] | length' "$DIFF_ROOT"/artifacts/cases/*/comparison.json 2>/dev/null || echo 0)
          unknown=$(jq -s '[.[] | select(.verdict == "UNKNOWN")] | length' "$DIFF_ROOT"/artifacts/cases/*/comparison.json 2>/dev/null || echo 0)
          refuted=$(jq -s '[.[] | select(.verdict == "REFUTED")] | length' "$DIFF_ROOT"/artifacts/cases/*/comparison.json 2>/dev/null || echo 0)
          normal=$(jq -s '[.[] | select(.verdict == "CLOSED")] | length' "$DIFF_ROOT"/artifacts/cases/*/comparison.json 2>/dev/null || echo 0)
          generated_count=$(find "$DIFF_ROOT/artifacts/generated-go" -type f | wc -l | tr -d ' ')
          generated_bytes=$(find "$DIFF_ROOT/artifacts/generated-go" -type f -exec stat -c '%s' {} \; 2>/dev/null | awk '{sum += $1} END {print sum + 0}')
          go_files=$(find . -path './.git' -prune -o -path './.ci-generated' -prune -o -name '*.go' -type f -print | wc -l | tr -d ' ')
          gooo_files=$(find . -path './.git' -prune -o -path './.ci-generated' -prune -o -name '*.gooo' -type f -print | wc -l | tr -d ' ')
          regular_files=$(find . -path './.git' -prune -o -path './.ci-generated' -prune -o -name README.md -prune -o -type f -print | wc -l | tr -d ' ')
          subdirectories=$(find . -path './.git' -prune -o -path './.ci-generated' -prune -o -type d -print | tail -n +2 | wc -l | tr -d ' ')
          go_lines=$(find . -path './.git' -prune -o -path './.ci-generated' -prune -o -name '*.go' -type f -print0 | xargs -0 awk 'END {print NR + 0}')
          gooo_lines=$(find . -path './.git' -prune -o -path './.ci-generated' -prune -o -name '*.gooo' -type f -print0 | xargs -0 awk 'END {print NR + 0}')
          overall=CLOSED
          if [ "$failed" -gt 0 ]; then overall=REFUTED; elif [ "$unknown" -gt 0 ]; then overall=UNKNOWN; fi
          jq -n \
            --arg schema 'gooo.differential-evidence/v1' \
            --arg authority 'metacode' \
            --arg commit "$GITHUB_SHA" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg run "$GITHUB_RUN_ID" \
            --arg semantics_digest "sha256:$(sha256sum "$SEMANTICS" | awk '{print $1}')" \
            --arg corpus_digest "sha256:$(sha256sum "$CORPUS" | awk '{print $1}')" \
            --arg overall "$overall" \
            --argjson compile_ms "$compile_ms" --argjson build_ms "$build_ms" --argjson test_ms "$test_ms" --argjson conformance_ms "$conformance_ms" --argjson integration_ms "$integration_ms" \
            --argjson compile_rss "$compile_rss" --argjson build_rss "$build_rss" --argjson test_rss "$test_rss" --argjson conformance_rss "$conformance_rss" --argjson integration_rss "$integration_rss" \
            --argjson total "$total" --argjson selected "$selected" --argjson executed "$executed" --argjson reused "$reused" --argjson failed "$failed" --argjson unknown "$unknown" \
            --argjson normal "$normal" --argjson refuted "$refuted" --argjson generated_count "$generated_count" --argjson generated_bytes "$generated_bytes" \
            --argjson go_files "$go_files" --argjson gooo_files "$gooo_files" --argjson go_lines "$go_lines" --argjson gooo_lines "$gooo_lines" --argjson regular_files "$regular_files" --argjson subdirectories "$subdirectories" \
            '{schema:$schema,authority:$authority,ci_authority:"github-actions",commit_sha:$commit,workflow:$workflow,run_id:$run,toolchain:{go:"1.27.x",target:"go1.27"},semantic_contract:{path:".gooo/semantics.gooo",digest:$semantics_digest},corpus:{path:".gooo/corpus.gooo",digest:$corpus_digest,normal:4,unknown:2,refuted:2,replay:1,total:9},status_precedence:["REFUTED","UNKNOWN","CLOSED"],overall_status:$overall,comparison_fields:["typed_value","ordered_effect_trace","terminal_explanation_digest"],inventory:{root_readme_excluded:true,go_files:$go_files,gooo_files:$gooo_files,go_physical_lines:$go_lines,gooo_physical_lines:$gooo_lines,regular_files:$regular_files,subdirectories:$subdirectories},generated_artifacts:{count:$generated_count,bytes:$generated_bytes},runtime_ms:{compile:$compile_ms,build:$build_ms,test:$test_ms,conformance:$conformance_ms,integration:$integration_ms},peak_rss_kib:{compile:$compile_rss,build:$build_rss,test:$test_rss,conformance:$conformance_rss,integration:$integration_rss},tests:{total:$total,selected:$selected,executed:$executed,reused:$reused,failed:$failed,unknown:$unknown,normal:$normal,refuted:$refuted},replay:{case_id:"replay-deterministic",byte_identical:true},improvement:{status:"UNKNOWN",reason:"matched scenario, source, contract, and toolchain before/after integer evidence is absent"}}' > "$DIFF_ROOT/artifacts/differential-evidence.json"
          cp "$SEMANTICS" "$DIFF_ROOT/artifacts/semantics.gooo"
          cp "$CORPUS" "$DIFF_ROOT/artifacts/corpus.gooo"
          find "$DIFF_ROOT/artifacts" -maxdepth 3 -type f -print | sort > "$DIFF_ROOT/artifacts/manifest.txt"

      - name: Require all differential assertions
        if: always()
        run: |
          set -euo pipefail
          test "${{ steps.execution.outcome }}" = success
          test "${{ steps.replay.outcome }}" = success
          test "${{ steps.conformance.outcome }}" = success

      - name: Upload differential evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gooo-differential-evidence
          path: ${{ runner.temp }}/gooo-differential/artifacts
          if-no-files-found: error
